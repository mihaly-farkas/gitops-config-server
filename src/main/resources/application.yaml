spring:
  application:
    name: gitops-config-server
  main:
    banner-mode: off
  mvc:
    # Enable Problem Details (RFC 9457) support for Spring MVC controllers.
    # This is a standard way to represent errors in HTTP APIs.
    problemdetails:
      enabled: true
  web:
    # Disable Spring Boot's default static resource mappings.
    # Since this is an API-only service, no static resources are served, and this prevents
    # unnecessary resource handling, potentially improving performance and security and avoiding
    # confusing error messages.
    resources:
      add-mappings: false
  cloud:
    config:
      server:
        # The version of the Spring Cloud Config Server API.
        # See: https://docs.spring.io/spring-cloud-config/docs/current/reference/html/
        prefix: /config/v4

server:
  port: 8888

management:
  endpoints:
    web:
      base-path: /actuator/v3
      exposure:
        include: health

springdoc:
  api-docs:
    enabled: true
    # The version of the SpringDoc OpenAPI API.
    # See: https://springdoc.org
    path: /api-docs/v3
  swagger-ui:
    enabled: true
    csrf:
      enabled: true
  show-actuator: true
  group-configs:
    - group: spring-boot-actuator
      display-name: Spring Boot Actuator
      paths-to-match:
        - /actuator/**
    - group: spring-cloud-config
      display-name: Spring Cloud Config
      paths-to-match:
        - /config/**

logging:
  level:
    root: INFO
