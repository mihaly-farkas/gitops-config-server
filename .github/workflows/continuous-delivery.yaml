name: "Continuous Delivery"
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/*
    paths-ignore:
      - .github/dependabot.yaml
      - .mvn/ruleset.xml
      - examples/**
      - tool/feature-runner/.husky
      - tool/feature-runner/.editorconfig
      - tool/feature-runner/.gitignore
      - tool/script/*.sh
      - .editorconfig
      - .gitignore
      - CHANGELOG.md
      - LICENSE
      - README.md
concurrency:
  group: ${{ github.repository }}-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-maven:
    name: "Build Maven Artifact"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      maven-artifact-group-id: ${{ steps.prepare.outputs.maven-artifact-group-id }}
      maven-artifact-id: ${{ steps.prepare.outputs.maven-artifact-id }}
      maven-artifact-version: ${{ steps.prepare.outputs.maven-artifact-version }}
      maven-is-snapshot: ${{ steps.prepare.outputs.maven-artifact-is-snapshot }}
      maven-artifact-publish: ${{ steps.prepare.outputs.maven-artifact-publish }}
      build-artifact-pom-id: ${{ steps.upload-artifact-pom.outputs.artifact-id }}
      build-artifact-pom-url: ${{ steps.upload-artifact-pom.outputs.artifact-url }}
      build-artifact-main-jar-id: ${{ steps.upload-artifact-main-jar.outputs.artifact-id }}
      build-artifact-main-jar-url: ${{ steps.upload-artifact-main-jar.outputs.artifact-url }}
      docker-metadata-action-tags: ${{ steps.prepare.outputs.docker-metadata-action-tags }}
    steps:
      - name: "Checkout Git repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: "Cache Maven target dir"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ github.repository }}-build-${{ github.ref }}-maven-target-${{ runner.os }}-${{ github.run_id }}

      - name: "Set up Java"
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 25
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml
          server-id: github

      - name: "Prepare build environment"
        id: prepare
        run: |
          # Prepare build environment
          chmod +x .github/workflows/continuous-delivery/prepare-env.sh
          .github/workflows/continuous-delivery/prepare-env.sh

      - name: "Build Maven artifact"
        env:
          MAVEN_ARTIFACT_GROUP_ID: ${{ steps.prepare.outputs.maven-artifact-group-id }}
          MAVEN_ARTIFACT_ID: ${{ steps.prepare.outputs.maven-artifact-id }}
          MAVEN_ARTIFACT_VERSION: ${{ steps.prepare.outputs.maven-artifact-version }}
          BUILD_ARTIFACT: ${{ steps.prepare.outputs.maven-artifact-publish }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # Build Maven artifact
          chmod +x .github/workflows/continuous-delivery/build-maven.sh
          .github/workflows/continuous-delivery/build-maven.sh

      - name: "Upload pom.xml build artifact"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload-artifact-pom
        with:
          name: pom.xml
          path: pom.xml
          retention-days: 7

      - name: "Upload main .jar build artifact"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload-artifact-main-jar
        with:
          name: ${{ steps.prepare.outputs.maven-artifact-id }}-${{ steps.prepare.outputs.maven-artifact-version }}.jar
          path: target/
          retention-days: 7

      - name: "Generate GitHub Actions report"
        env:
          MAVEN_ARTIFACT_GROUP_ID: ${{ steps.prepare.outputs.maven-artifact-group-id }}
          MAVEN_ARTIFACT_ID: ${{ steps.prepare.outputs.maven-artifact-id }}
          MAVEN_ARTIFACT_VERSION: ${{ steps.prepare.outputs.maven-artifact-version }}
          BUILD_ARTIFACT: ${{ steps.prepare.outputs.maven-artifact-publish }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          BUILD_ARTIFACT_POM_URL: ${{ steps.upload-artifact-pom.outputs.artifact-url }}
          BUILD_ARTIFACT_MAIN_JAR_URL: ${{ steps.upload-artifact-main-jar.outputs.artifact-url }}
        run: |
          # Build Maven artifact
          chmod +x .github/workflows/continuous-delivery/build-maven-report.sh
          .github/workflows/continuous-delivery/build-maven-report.sh

  pre-build-docker:
    name: "Build Docker Image"
    runs-on: ubuntu-latest
    needs:
      build-maven
    permissions:
      contents: read
    steps:
      - name: "Checkout Git repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Cache Maven target dir"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ github.repository }}-build-${{ github.ref }}-maven-target-${{ runner.os }}-${{ github.run_id }}

      - name: "Set Up Docker Buildx"
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: "Pre-Build Docker image"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          load: true
          tags: ghcr.io/${{ github.repository }}:local
          build-args: |
            APP_VERSION=${{ needs.build-maven.outputs.maven-artifact-version }}
            BUILD_ID=${{ github.run_id }}
          context: .
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
  feature-test:
    name: "Run Feature Tests"
    runs-on: ubuntu-latest
    needs:
      - build-maven
      - pre-build-docker
    permissions:
      contents: read
    steps:
      - name: "Checkout Git repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Cache Maven target dir"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ github.repository }}-build-${{ github.ref }}-maven-target-${{ runner.os }}-${{ github.run_id }}

      - name: "Set Up Docker Buildx"
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: "Re-Build Docker image (from cache)"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          load: true
          tags: ghcr.io/${{ github.repository }}:local
          build-args: |
            APP_VERSION=${{ needs.build-maven.outputs.maven-artifact-version }}
            BUILD_ID=${{ github.run_id }}
          context: .
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Set up Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tool/feature-runner/package-lock.json

      - name: "Run feature tests"
        run: |
          # Run feature tests
          chmod +x .github/workflows/continuous-delivery/run-feature-tests.sh
          .github/workflows/continuous-delivery/run-feature-tests.sh

      - name: "Upload cucumber report build artifact"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload-artifact-cucumber-report
        with:
          name: cucumber-report.html
          path: tool/feature-runner/reports/cucumber-report.html
          retention-days: 7
  snyk-maven-test:
    name: "Run Snyk Maven Test"
    runs-on: ubuntu-latest
    needs:
      - build-maven
      - pre-build-docker
    permissions:
      contents: read
      security-events: write
    steps:
      - name: "Checkout Git repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Run Snyk Maven test"
        uses: snyk/actions/maven@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: >-
            --file=pom.xml
            --sarif-file-output=snyk.sarif
            --json-file-output=snyk.json

      - name: "Upload Snyk Maven test result"
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: snyk.sarif

      - name: "Upload Snyk Maven snyk.json build artifact"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload-artifact-snyk-json
        with:
          name: maven-snyk.json
          path: snyk.json
          retention-days: 7

  #      - name: "Run Snyk Maven monitor"
  #        uses: snyk/actions/maven@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
  #        continue-on-error: true
  #        env:
  #          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  #        with:
  #          command: monitor
  #          args: >-
  #            --org="${{ github.repository_owner }}"
  #            --project-name="${{ github.repository }}"
  #            --file=pom.xml

  snyk-docker-test:
    name: "Run Snyk Docker Test"
    runs-on: ubuntu-latest
    needs:
      - build-maven
      - pre-build-docker
    permissions:
      contents: read
      security-events: write
    steps:
      - name: "Checkout Git repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Set Up Docker Buildx"
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: "Download main .jar build artifact"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-maven.outputs.build-artifact-main-jar-id }}
          path: target/

      - name: "Re-Build Docker image (from cache)"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          load: true
          tags: ghcr.io/${{ github.repository }}:${{ needs.build-maven.outputs.maven-is-snapshot == 'true' && format('{0}', 'unstable') || format('{0}', 'latest') }}
          build-args: |
            APP_VERSION=${{ needs.build-maven.outputs.maven-artifact-version }}
            BUILD_ID=${{ github.run_id }}
          context: .
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Run Snyk Docker test"
        uses: snyk/actions/docker@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ghcr.io/${{ github.repository }}:${{ needs.build-maven.outputs.maven-is-snapshot == 'true' && format('{0}', 'unstable') || format('{0}', 'latest') }}
          command: test
          args: >-
            --file=Dockerfile
            --sarif-file-output=snyk.sarif
            --json-file-output=snyk.json

      - name: "Upload Snyk Docker test result"
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: snyk.sarif

      - name: "Upload Snyk Docker snyk.json build artifact"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload-artifact-snyk-json
        with:
          name: docker-snyk.json
          path: snyk.json
          retention-days: 7

  #      - name: "Run Snyk Docker scan"
  #        uses: snyk/actions/docker@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
  #        continue-on-error: true
  #        env:
  #          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  #        with:
  #          image: ghcr.io/${{ github.repository }}:${{ needs.build-maven.outputs.maven-is-snapshot == 'true' && format('{0}', 'unstable') || format('{0}', 'latest') }}
  #          command: monitor
  #          args: >-
  #            --org="${{ github.repository_owner }}"
  #            --project-name="${{ github.repository }}"
  #            --file=Dockerfile

  publish-maven:
    name: "Publish Maven Artifact"
    runs-on: ubuntu-latest
    needs:
      - build-maven
      - feature-test
      - snyk-maven-test
      - snyk-docker-test
    permissions:
      contents: read
      packages: write
    steps:
      - name: "Checkout Git repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Cache Maven target dir"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ github.repository }}-build-${{ github.ref }}-maven-target-${{ runner.os }}-${{ github.run_id }}

      - name: "Set up Java"
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 25
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml
          server-id: github

      - name: "Publish Maven artifact"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Publish Maven artifact
          chmod +x mvnw
          ./mvnw --batch-mode deploy -Dmaven.main.skip=true -Dmaven.test.skip=true -Dcompiler.skip=true


  publish-docker:
    name: "Publish Docker Image"
    runs-on: ubuntu-latest
    needs:
      - build-maven
      - feature-test
      - snyk-maven-test
      - snyk-docker-test
    permissions:
      contents: read
      packages: write
    steps:
      - name: "Checkout Git repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Cache Maven target dir"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ github.repository }}-build-${{ github.ref }}-maven-target-${{ runner.os }}-${{ github.run_id }}

      - name: "Set Up Docker Buildx"
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Extract Docker metadata"
        id: docker-metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=sha,format=long
            ${{ needs.build-maven.outputs.docker-metadata-action-tags }}

      - name: "Publish Docker image"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.docker-metadata.outputs.tags }}
          labels: ${{ steps.docker-metadata.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.build-maven.outputs.maven-artifact-version }}
            BUILD_ID=${{ github.run_id }}
          context: .
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
