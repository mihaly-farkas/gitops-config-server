name: "Continuous Delivery"
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/*
    paths-ignore:
      - .github/dependabot.yaml
      - .mvn/ruleset.xml
      - examples/**
      - tools/feature-runner/.husky
      - tools/feature-runner/.editorconfig
      - tools/feature-runner/.gitignore
      - tools/*.sh
      - .editorconfig
      - .gitignore
      - CHANGELOG.md
      - LICENSE
      - README.md
concurrency:
  group: ${{ github.repository }}-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    name: "Build & Publish"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: read
    steps:
      - name: "Checkout Git repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          fetch-depth: 0

      - name: "Set up Java"
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 25
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml
          server-id: github

      - name: "Set up Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/feature-runner/package-lock.json

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: "Set up GitHub Pages"
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: "Prepare build environment"
        id: prepare
        run: chmod +x .github/workflows/continuous-delivery/prepare-env.sh && .github/workflows/continuous-delivery/prepare-env.sh

      - name: "Build and publish Maven artifact"
        env:
          MAVEN_ARTIFACT_GROUP_ID: ${{ steps.prepare.outputs.maven-artifact-group-id }}
          MAVEN_ARTIFACT_ID: ${{ steps.prepare.outputs.maven-artifact-id }}
          MAVEN_ARTIFACT_VERSION: ${{ steps.prepare.outputs.maven-artifact-version }}
          PUBLISH_MAVEN_ARTIFACT: ${{ steps.prepare.outputs.publish-maven-artifact }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: .github/workflows/continuous-delivery/build-maven.sh

      - name: "Build `feature-test` Docker image"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          load: true
          tags: ghcr.io/${{ github.repository }}:feature-test
          context: .
          build-args: |
            APP_VERSION=${{ steps.prepare.outputs.maven-artifact-version }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Run feature tests"
        run: .github/workflows/continuous-delivery/run-feature-tests.sh

      - name: "Scan Docker image with Snyk"
        uses: snyk/actions/docker@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ghcr.io/${{ github.repository }}:feature-test
          args: --file=Dockerfile

      - name: "Upload scan Snyk result"
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: snyk.sarif

      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Extract Docker metadata"
        id: docker-metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=sha,format=long
            ${{ steps.prepare.outputs.docker-metadata-action-tags }}

      - name: "Publish Docker image"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.docker-metadata.outputs.tags }}
          labels: ${{ steps.docker-metadata.outputs.labels }}
          context: .
          build-args: |
            APP_VERSION=${{ steps.prepare.outputs.maven-artifact-version }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Prepare documentation"
        env:
          DOCKER_IMAGE_REFERENCES: ${{ steps.docker-metadata.outputs.tags }}
        run: .github/workflows/continuous-delivery/prepare-docs.sh

      - name: "Upload GitHub Pages artifact"
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .tmp/github-pages

  deploy-github-pages:
    name: "Deploy GitHub Pages"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    needs:
      - publish
    steps:
      - name: "Set up GitHub Pages"
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: "Deploy GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
