version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: daily
    groups:
      maven-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: build
      prefix-development: chore
      include: scope
    reviewers:
      - mihaly-farkas

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      actions-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: ci
    reviewers:
      - mihaly-farkas

  - package-ecosystem: npm
    directory: /tools/feature-runner
    schedule:
      interval: daily
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      - dependency-name: typescript
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: test
      include: scope
    reviewers:
      - mihaly-farkas

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    registries:
      - dhi-registry
    allow:
      - dependency-type: direct
    groups:
      docker-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "dhi.io/eclipse-temurin"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: build
      include: scope
    reviewers:
      - mihaly-farkas

registries:
  dhi-registry:
    type: docker-registry
    url: https://dhi.io
    username: ${{ secrets.DHI_REGISTRY_USERNAME }}
    password: ${{ secrets.DHI_REGISTRY_PASSWORD }}
